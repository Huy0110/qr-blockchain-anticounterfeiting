[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.default.fuzz]
runs = 256

[profile.ci]
fuzz = { runs = 1024 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

[rpc_endpoints]
amoy = "${RPC_URL_AMOY}"
mainnet = "${RPC_URL_MAINNET}"

[etherscan]
amoy = { key = "${ETHERSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api" }
mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.polygonscan.com/api" }
