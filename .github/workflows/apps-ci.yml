name: apps-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apps-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: ${{ matrix.workspace }} (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - '@qr-bc/shared'
          - '@qr-bc/coordination-hub'
          - '@qr-bc/dapp-portal'
          - '@qr-bc/management-portal'
          - '@qr-bc/experiments'
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # @qr-bc/shared is a workspace dep for everything else — build it
      # first so downstream packages resolve dist/.
      - name: Build shared
        if: matrix.workspace != '@qr-bc/shared'
        run: pnpm --filter @qr-bc/shared build

      - name: Typecheck
        run: pnpm --filter ${{ matrix.workspace }} typecheck

      - name: Lint
        run: pnpm --filter ${{ matrix.workspace }} lint

      - name: Test (unit + integration via vitest)
        # AC-CI-7: workspaces with coverage tooling run --coverage and
        # emit lcov for the threshold gate + Codecov upload below.
        run: |
          if [ "${{ matrix.workspace }}" = "@qr-bc/coordination-hub" ] || \
             [ "${{ matrix.workspace }}" = "@qr-bc/management-portal" ]; then
            pnpm --filter ${{ matrix.workspace }} test:cov
          else
            pnpm --filter ${{ matrix.workspace }} test
          fi

      - name: Coverage gate — hub ≥ 70% (AC-CI-7)
        if: matrix.workspace == '@qr-bc/coordination-hub'
        run: node scripts/check-coverage.cjs apps/coordination-hub/coverage/lcov.info 70

      - name: Coverage gate — mgmt-portal ≥ 20% Vitest-only floor
        # AC-MP-15 calls for 70% Vitest + Playwright combined. The
        # combined measurement requires istanbul-instrumented builds
        # (a Phase 12 polish); for now we gate the Vitest slice at a
        # regression floor so a PR can't accidentally drop unit-test
        # coverage. Playwright covers the UI flows separately.
        if: matrix.workspace == '@qr-bc/management-portal'
        run: node scripts/check-coverage.cjs apps/management-portal/coverage/lcov.info 20

      - name: Build
        if: matrix.workspace != '@qr-bc/shared'
        run: pnpm --filter ${{ matrix.workspace }} build

      - name: Upload coverage to Codecov
        if: always() && (matrix.workspace == '@qr-bc/coordination-hub' || matrix.workspace == '@qr-bc/management-portal')
        uses: codecov/codecov-action@v4
        with:
          files: apps/${{ matrix.workspace == '@qr-bc/coordination-hub' && 'coordination-hub' || 'management-portal' }}/coverage/lcov.info
          flags: ${{ matrix.workspace }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  i18n-parity:
    name: i18n key parity (vi ↔ en)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # AC-BR-3/AC-BR-4: every key in apps/<app>/messages/vi.json must
      # also exist in en.json (and vice versa). The script walks both
      # apps and exits non-zero on any drift.
      - name: Check i18n key parity
        run: pnpm --filter @qr-bc/experiments exec tsx ../scripts/i18n-key-parity.ts

  playwright-dapp:
    name: dapp-portal Playwright (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build shared + dapp
        run: |
          pnpm --filter @qr-bc/shared build
          pnpm --filter @qr-bc/dapp-portal build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browsers
        run: pnpm --filter @qr-bc/dapp-portal exec playwright install --with-deps chromium webkit

      - name: Run Playwright
        run: pnpm --filter @qr-bc/dapp-portal exec playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: dapp-playwright-report
          path: apps/dapp-portal/playwright-report/
          retention-days: 7

  playwright-mgmt:
    name: management-portal Playwright (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @qr-bc/shared build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browsers
        run: pnpm --filter @qr-bc/management-portal exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter @qr-bc/management-portal exec playwright test
        env:
          MGMT_PORTAL_E2E_BYPASS: '1'
          NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-prod-AAAAAAAAAAA
          NEXTAUTH_URL: http://localhost:3001
          NEXT_PUBLIC_HUB_BASE_URL: http://localhost:3000/api/v1

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mgmt-playwright-report
          path: apps/management-portal/playwright-report/
          retention-days: 7

  lighthouse-dapp:
    name: dapp-portal Lighthouse (perf ≥ 85, a11y ≥ 90)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build dapp
        run: |
          pnpm --filter @qr-bc/shared build
          pnpm --filter @qr-bc/dapp-portal build

      - name: Serve out/ + lhci
        run: |
          node apps/dapp-portal/test/serve-static.cjs apps/dapp-portal/out 8765 &
          sleep 3
          npx --yes @lhci/cli@0.14.x autorun --config=.lighthouserc.json
